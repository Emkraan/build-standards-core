name: gallery-release
# Publishes the built kit gallery with every release, so other accounts can see the reference
# without building it. It ships as a release asset (and a run artifact).
on:
  release:
    types: [published]
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: gallery-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  gallery:
    runs-on: ${{ fromJSON(vars.CORE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kit
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kit/package-lock.json
      - run: npm ci
      - run: npm run gallery:build
      - name: Zip the gallery
        run: |
          mv dist-gallery "kit-gallery-${TAG}"
          zip -qr "kit-gallery-${TAG}.zip" "kit-gallery-${TAG}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-gallery-${{ github.ref_name }}
          path: kit/kit-gallery-${{ github.ref_name }}.zip
          if-no-files-found: error
      # Consumers pin the newest release, not the newest tag (update-core.py), so a tag without a
      # release never reaches them. A tag push therefore publishes its release when none exists,
      # with the CHANGELOG entry as the notes. --clobber makes a second upload a no-op replace.
      - name: Publish the release and attach the gallery
        working-directory: .
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            awk -v t="($TAG" 'index($0,"## ")==1{p=index($0,t)>0;next} p' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md -R "$GITHUB_REPOSITORY"
          fi
          gh release upload "$TAG" "kit/kit-gallery-${TAG}.zip" --clobber -R "$GITHUB_REPOSITORY"
