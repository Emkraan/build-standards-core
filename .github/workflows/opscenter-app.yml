name: opscenter-app
on:
  pull_request:
    paths:
      - 'opscenter/app/**'
      - 'opscenter/kit/**'
      - 'opscenter/tokens/**'
      - '.github/workflows/opscenter-app.yml'
permissions:
  contents: read
jobs:
  app:
    runs-on: ${{ fromJSON(vars.CORE_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            opscenter/kit/package-lock.json
            opscenter/app/package-lock.json
      # The app builds against the kit source (alias @kit), so the kit's own dependencies are installed too.
      - run: npm ci
        working-directory: opscenter/kit
      - run: npm ci
        working-directory: opscenter/app
      - run: npm run typecheck
        working-directory: opscenter/app
      - run: npm test
        working-directory: opscenter/app
      - run: npm run build
        working-directory: opscenter/app
      # The browser tests run on this same runner, whatever CORE_RUNNER points at, with no hosted fallback.
      # The runner needs no Chrome of its own: the Chromium that the pinned playwright-core devDependency
      # names is downloaded once per version and cached. Only the system libraries Chromium links against
      # must exist on the runner. tests/browserGate.mjs fails (never skips) when the browser is missing.
      - id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: opscenter/app
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      - run: npx playwright-core install chromium
        working-directory: opscenter/app
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      - name: Browser tests (axe, live actions, tabs)
        run: |
          CHROME_BIN="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          export CHROME_BIN
          "$CHROME_BIN" --version
          npm run test:browser
        working-directory: opscenter/app
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          # Ubuntu 24.04 restricts the user namespaces Chromium's sandbox needs; the job runs only this repo's own code.
          CHROME_NO_SANDBOX: '1'
