name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  ci:
    runs-on: ${{ fromJSON(vars.CORE_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Consumers run the overlay scripts with the oldest Python still shipped with macOS, so the
      # core proves everything on that floor.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
      - run: python3 checks/check-sanitised.py
      - run: python3 checks/check-ascii.py
      - run: python3 checks/check-placeholders.py
      - run: python3 checks/check-links.py
      - run: python3 tokens/build.py --check
      - run: python3 lint/ui_lint.py --self-test
      - run: python3 lint/ui_lint.py tokens/hub-layer.css
      - run: python3 lint/ui_lint.py kit/src
      - run: python3 lint/script_lint.py --self-test
      - run: python3 checks/check-css-vars.py
      - run: python3 checks/check-token-names.py
      - run: python3 checks/check-rules.py
      - run: python3 hermes/build_skills.py --self-test
      - run: python3 checks/check-hermes-skills.py
      - run: python3 checks/check-hermes-tools.py
      - run: python3 checks/check-changelog.py "origin/${GITHUB_BASE_REF:-main}"
      - run: python3 checks/check-consumer-neutral.py
      - run: python3 checks/check-kit-comments.py
      - run: python3 templates/overlay/scripts/triage_marker.py --self-test
      - run: python3 templates/overlay/scripts/core-ci.py kit-peers kit/src
      - run: python3 templates/overlay/scripts/core-ci.py workflow-lint templates/overlay/.github/workflows .github/workflows
      # The secret-scan self-test plants a secret and needs the pinned scanner, checksum verified.
      - run: python3 templates/overlay/scripts/core-ci.py install-gitleaks "$RUNNER_TEMP/bin"
      # Secret scan of the change, with the base commit's scanner config (never the config under scan).
      - name: Secret scan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 templates/overlay/scripts/core-ci.py secret-scan "$BASE" "$HEAD" --gitleaks "$RUNNER_TEMP/bin/gitleaks"
      # Ruff, pinned, both commands, against [tool.ruff] in pyproject.toml.
      - run: python3 -m pip install --quiet ruff==0.16.6
      - run: ruff check .
      - run: ruff format --check .
      - run: GITLEAKS="$RUNNER_TEMP/bin/gitleaks" python3 -m unittest discover -s tests -p "test_*.py"
      - run: python3 checks/check-authors.py "origin/${GITHUB_BASE_REF:-main}"
      # A closing keyword in front of a consumer-report issue would close that account's report on merge.
      - run: python3 checks/check-closing-refs.py "origin/${GITHUB_BASE_REF:-main}"
        env:
          GH_TOKEN: ${{ github.token }}
