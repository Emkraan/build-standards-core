name: core-drift
# core-managed: this file is refreshed from the core release by scripts/sync-core.py
# Offline checks, no secret and no access to the core needed: the synced copies match the hash in
# standards.lock, exceptions are well-formed and current, every declared stack has its lint config
# (core-status --require-lint-config) and the script lint passes (paths in
# standards-local/script-lint.json, a skip line when that file does not exist).
# Paths are relative to the repo root: when the overlay is a subfolder, write its path in front of each
# (python3 <overlay>/scripts/...); scripts/sync-core.py keeps that prefix and the cron line when it
# refreshes this file.
on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # core-sync: keep
permissions:
  contents: read
jobs:
  drift:
    # CORE_CI_RUNNER (a JSON runs-on value, as in core-ci.yml) picks a self-hosted runner, for
    # example where hosted minutes are not available; unset, the job runs on ubuntu-latest.
    runs-on: ${{ fromJSON(vars.CORE_CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check-core-sync.py
      - run: python3 scripts/check-exceptions.py
      - run: python3 scripts/core-status.py --require-lint-config
      - run: python3 lint-core/script_lint.py
