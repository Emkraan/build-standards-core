name: core-ci
# The CI half of the core standard. ONE job, core-checks, runs every check as a named step; each step
# proves one or more overlay-ci rules in standards-core/rules.json (check.workflow is this file,
# check.jobs names the steps). Every check is a subcommand of scripts/core-ci.py (standard library
# Python); the only third-party code is the pinned actions below and the scanner, analyzer and ruff,
# each pinned by version and checksum in that script. Values come from standards-local/parameters.md
# (the core-setup step reads them), so this file names no consumer.
#
# Why one job: the checks are small scripts, so a job's cost is mostly runner start and checkout. One
# job per pull request run keeps the runner pool free for real work (twelve jobs per run used to be
# most of a busy consumer's queue). A failed step does not stop the others (each runs unless the run
# was cancelled), so one run reports every finding, and core-status reads each step's result.
#
# When each step runs:
#   pull_request (opened, edited, synchronize, reopened) and merge_group: every check.
#   An edit (title or body) runs every check too, never a lighter subset: the newest run's result for
#   the check name `core-checks` is the one the merge gate reads, and an edit that starts seconds after
#   a push cancels that push's run through the concurrency group. A lighter edit run would then report
#   a green `core-checks` for a commit whose full checks were cancelled or had failed.
#   push to the default branch: only core-secret-scan, the one check that covers a commit that lands
#   without a pull request. The merge gate requires an up to date head, so re-running the rest after
#   the merge would re-test the tree the pull request run proved.
#
# Configure: OVERLAY is the overlay folder relative to the repo root ("." when it is the root).
# scripts/sync-core.py refreshes this file on every sync and keeps the repo's OVERLAY value.
# The repository variable CORE_CI_RUNNER, when set, is a JSON runs-on value (for example
# '["self-hosted", "linux", "arm64"]'); unset, the job runs on ubuntu-24.04 (not ubuntu-latest: newer images have no Python 3.9 build for the Python floor). The job id, its check
# name and every check step name start with core-, so nothing here shares a name with the repo's own
# workflows. Require the one check name core-checks in the merge gate: `python3
# "$OVERLAY/scripts/core-ci.py" required-checks` reports it when nothing requires it and lists the
# old per-job names a gate still requires, and `--fix` prints the command that corrects the gate.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  OVERLAY: .
  BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  # Every check: pull requests (including a title or body edit) and merge queue entries.
  FULL: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
  # Checks that read the pull request's commits: pull requests only (a merge queue entry has no pull
  # request of its own; its commits were checked on the pull request).
  COMMITS: ${{ github.event_name == 'pull_request' }}
jobs:
  core-checks:
    name: core-checks
    runs-on: ${{ fromJSON(vars.CORE_CI_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: core-setup
        id: p
        run: python3 "$OVERLAY/scripts/core-ci.py" params --github-output

      - name: core-secret-scan
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        run: |
          python3 "$OVERLAY/scripts/core-ci.py" install-gitleaks "$RUNNER_TEMP/bin"
          python3 "$OVERLAY/scripts/core-ci.py" secret-scan "$BASE" "$HEAD" --gitleaks "$RUNNER_TEMP/bin/gitleaks"

      - name: core-workflow-lint
        if: ${{ !cancelled() && env.FULL == 'true' }}
        run: python3 "$OVERLAY/scripts/core-ci.py" workflow-lint

      - name: core-ascii
        if: ${{ !cancelled() && env.FULL == 'true' }}
        run: python3 "$OVERLAY/scripts/core-ci.py" ascii

      - name: core-pr-title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 "$OVERLAY/scripts/core-ci.py" pr-title

      - name: core-commitlint
        if: ${{ !cancelled() && env.COMMITS == 'true' }}
        run: python3 "$OVERLAY/scripts/core-ci.py" commitlint "$BASE" "$HEAD"

      - name: core-attribution
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 "$OVERLAY/scripts/core-ci.py" attribution "$BASE" "$HEAD"

      - name: core-identity
        if: ${{ !cancelled() && env.COMMITS == 'true' }}
        run: python3 "$OVERLAY/scripts/core-ci.py" identity "$BASE" "$HEAD"

      # One entry per pull request, append-only, when the parameters row "Changelog entries" is per-pr.
      - name: core-changelog
        if: ${{ !cancelled() && env.COMMITS == 'true' }}
        run: |
          python3 "$OVERLAY/scripts/core-ci.py" changelog "$BASE" "$HEAD"
          python3 "$OVERLAY/scripts/core-ci.py" changelog-entries "$BASE" "$HEAD"

      # Stack steps run only when standards-local/parameters.md declares the stack (core-setup outputs).
      - name: set up the Python floor
        if: ${{ !cancelled() && env.FULL == 'true' && steps.p.outputs.python == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.p.outputs.python_floor }}
      - name: core-python
        if: ${{ !cancelled() && env.FULL == 'true' && steps.p.outputs.python == 'true' }}
        env:
          TEST_CMD: ${{ steps.p.outputs.python_test }}
        run: |
          python "$OVERLAY/scripts/core-ci.py" python-config
          python "$OVERLAY/scripts/core-ci.py" ruff-requirements > "$RUNNER_TEMP/ruff.txt"
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r "$RUNNER_TEMP/ruff.txt"
          python -m ruff check .
          python -m ruff format --check .
          bash -c "$TEST_CMD"

      - name: core-powershell
        if: ${{ !cancelled() && env.FULL == 'true' && steps.p.outputs.powershell == 'true' }}
        run: |
          python3 "$OVERLAY/scripts/core-ci.py" install-psscriptanalyzer "$RUNNER_TEMP/psmodules"
          python3 "$OVERLAY/scripts/core-ci.py" powershell --analyzer "$RUNNER_TEMP/psmodules"

      - name: core-node-pin
        if: ${{ !cancelled() && env.FULL == 'true' && steps.p.outputs.web == 'true' }}
        run: python3 "$OVERLAY/scripts/core-ci.py" node-pin

      # Static checks always; tsc runs too when the repo has installed it (add an install step before
      # this one to typecheck the copy with the optional peers blocked).
      - name: core-kit-peers
        if: ${{ !cancelled() && env.FULL == 'true' && steps.p.outputs.kit == 'true' }}
        run: python3 "$OVERLAY/scripts/core-ci.py" kit-peers

      # A REQUIRED_CHECKS list in a gate workflow must name every core-ci job and no removed one (a
      # repo gated by a ruleset has no list and skips). Fails the sync pull request that renames a job
      # before the stale list can deadlock the merge; `required-checks --fix` rewrites the list.
      - name: core-required-checks
        if: ${{ !cancelled() && env.FULL == 'true' }}
        run: python3 "$OVERLAY/scripts/core-ci.py" required-checks --lists-only
