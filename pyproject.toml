[tool.ruff]
line-length = 100
# The floor is the macOS system python (README, "Consuming the core"); core CI runs every script on 3.9.
target-version = "py39"
# lint/script-fixtures and opscenter/kit/tests/fixtures hold deliberately non-conforming inputs for the self-tests.
extend-exclude = ["lint/script-fixtures", "opscenter/kit/tests/fixtures", "opscenter/kit/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]           # the formatter owns wrapping; what survives is unwrappable
